# GENERATED BY ./ci.ts -- DO NOT DIRECTLY EDIT

name: CI
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - "*"
jobs:
  build:
    name: test_release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.x
          registry-url: "https://registry.npmjs.org"
      - name: Lint workflow generation
        run: |-
          ./.github/workflows/ci.ts --lint
          ./.github/workflows/check_updates.ts --lint
          ./.github/workflows/release.ts --lint
      - name: Test
        run: dotnet test
      - name: Install WASI SDK
        run: |-
          curl -sSfL https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-29/wasi-sdk-29.0-x86_64-linux.tar.gz | tar xz -C "$RUNNER_TEMP"
          echo "WASI_SDK_PATH=$RUNNER_TEMP/wasi-sdk-29.0-x86_64-linux" >> "$GITHUB_ENV"
      - name: Install dprint
        run: |-
          curl -fsSL https://dprint.dev/install.sh | sh
          echo "DPRINT_PATH=$HOME/.dprint/bin/dprint" >> "$GITHUB_ENV"
      - name: Build Wasm
        run: dotnet publish DprintPluginCSharpier -c Release -r wasi-wasm
      - name: Test Wasm
        env:
          DPRINT_CSHARPIER_WASM_PATH: "${{ github.workspace }}/DprintPluginCSharpier/bin/Release/net10.0/wasi-wasm/publish/dprint-plugin-csharpier.wasm"
        run: dotnet test --filter TestCategory=Wasm
      - name: Setup and test npm deployment
        run: |-
          cd deployment/npm
          npm install
          node setup.js
          npm run test
      - name: Get tag version
        id: get_tag_version
        if: "startsWith(github.ref, 'refs/tags/')"
        run: 'echo TAG_VERSION=${GITHUB_REF/refs\/tags\//} >> $GITHUB_OUTPUT'
      - name: Pre-release
        if: "startsWith(github.ref, 'refs/tags/')"
        run: |-
          # update config schema to have version
          sed -i 's/csharpier\/0.0.0/csharpier\/${{ steps.get_tag_version.outputs.TAG_VERSION }}/' deployment/schema.json
          # update the npm package to have version
          (cd deployment/npm && node setup.js sync-version)
          # create release notes
          deno run -A ./scripts/generate_release_notes.ts ${{ steps.get_tag_version.outputs.TAG_VERSION }} > ${{ github.workspace }}-CHANGELOG.txt
      - name: Release
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844
        if: "startsWith(github.ref, 'refs/tags/')"
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        with:
          files: |-
            deployment/npm/plugin.wasm
            deployment/schema.json
          body_path: "${{ github.workspace }}-CHANGELOG.txt"
          draft: false
      - name: Upgrade npm
        if: "startsWith(github.ref, 'refs/tags/')"
        run: npm install --global npm@latest
      - name: Publish npm package
        if: "startsWith(github.ref, 'refs/tags/')"
        run: |-
          cd deployment/npm
          npm publish --access public --provenance
